[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edusystem"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    # Database
    "sqlalchemy[asyncio]==2.0.35",
    "alembic==1.13.3",
    "aiosqlite==0.20.0",
    # Knowledge graph
    "kuzu==0.7.0",
    # Config and validation
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    # LLM + HTTP
    "httpx==0.27.2",
    # Templating
    "jinja2==3.1.4",
    # Logging
    "loguru==0.7.2",
    # Spaced repetition
    "fsrs==6.3.1",
    # File watching (ingestion)
    "watchdog==4.0.1",
    # Document parsing (ingestion — installed but used in week 6)
    "docling==2.94.0",
    "python-docx==1.1.2",
    "python-pptx==1.0.2",
    "pymupdf4llm==0.0.17",
    # Testing
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",  # also used for test client
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "agents*", "config*", "core*", "llm*", "scheduler*"]

[tool.setuptools.package-data]
llm = ["prompts/*.j2"]
config = ["streams/**/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]